<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>thingsynth</title>
  <meta name="description" content="A painting by Matt Crump that plays Tonewheel, a tonewheel organ synth, in the browser." />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="stage" aria-label="Painting"></main>
  <div id="start" role="button" tabindex="0">
    <div class="card">
      <h1>thingsynth</h1>
      <p id="start-title"></p>
      <p class="hint">Click or press a key to start the organ.<br />Keys A&ndash;; play notes, Z/X shift octave, Web MIDI is on.</p>
    </div>
  </div>
  <footer id="bar">
    <label>Preset <select id="preset"></select></label>
    <span id="wander-box"><button id="wander" type="button" aria-pressed="false" title="Let every parameter of the preset wander around it">Wander</button></span>
    <span id="shuffle-box"><button id="shuffle" type="button" title="Deal every parameter and note onto other animations of the painting">Shuffle</button><button id="unshuffle" type="button" title="Back to the curated mapping" hidden>&times;</button></span>
    <span id="status">off</span>
    <a id="about-link" href="about.html">What is this?</a>
    <a id="debug-link" href="?debug">debug</a>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
